[package]
name = "mysearch"
version = "0.1.0"
edition = "2021"
description = "Self-hosted, zero-cost search aggregation API for AI agents (AnySearch-compatible contract)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-std", "io-util"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "gzip",
    "charset",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
scraper = "0.29"
async-trait = "0.1"
url = "2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.7", features = ["trace"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
